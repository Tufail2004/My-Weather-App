<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Weather</h1>
      <div class="actions">
        <button id="unitToggle" class="chip-btn" title="Switch °C / °F">°C</button>
        <button id="geoBtn" class="chip-btn" title="Use my location">📍</button>
      </div>
    </header>

    <form id="searchForm" class="search" autocomplete="off">
      <input id="cityInput" type="text" placeholder="Search a city…" aria-label="Search city" />
      <button type="submit">Search</button>
    </form>
    <div id="history" class="history"></div>

    <section class="card">
      <div id="loader" class="loader hidden"><span></span></div>
      <div id="error" class="error hidden"></div>

      <div id="weather" class="hidden">
        <div class="place" id="location"></div>
        <div class="time" id="localtime"></div>
        <div class="main-row">
          <img id="weatherIcon" alt="Weather icon" />
          <div class="temp" id="temp"></div>
        </div>
        <div class="condition" id="condition"></div>
        <div class="feels" id="feels"></div>

        <div class="stats">
          <div class="stat">
            <span class="label">Humidity</span>
            <span class="value" id="humidity"></span>
          </div>
          <div class="stat">
            <span class="label">Wind</span>
            <span class="value" id="wind"></span>
          </div>
        </div>

        <div id="forecast" class="forecast"></div>
      </div>

      <div id="empty" class="empty">Search a city to see the weather.</div>
    </section>

    <footer>Powered by WeatherAPI</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
