<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Weather App</h1>
      <p>Check the weather anywhere</p>
    </header>

    <form id="searchForm" class="search" autocomplete="off">
      <input id="cityInput" type="text" placeholder="Enter city name..." aria-label="City name" />
      <button type="submit">Search</button>
    </form>

    <div id="error" class="error hidden"></div>

    <section id="empty" class="empty">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 7 19h10.5z"/>
      </svg>
      <p>Search for a city to see the weather</p>
    </section>

    <section id="card" class="card hidden">
      <div class="unit-switch" role="group" aria-label="Temperature unit">
        <button type="button" id="unitC" class="active">°C</button>
        <button type="button" id="unitF">°F</button>
      </div>

      <div id="loader" class="loader hidden"><span></span></div>

      <div id="weather">
        <img id="weatherIcon" alt="Weather icon" />
        <div class="temp" id="temp"></div>
        <div class="condition" id="condition"></div>
        <div class="place" id="location"></div>

        <div class="details">
          <div class="detail">
            <span class="label">Feels like</span>
            <span class="value" id="feels"></span>
          </div>
          <div class="detail">
            <span class="label">Humidity</span>
            <span class="value" id="humidity"></span>
          </div>
          <div class="detail">
            <span class="label">Wind</span>
            <span class="value" id="wind"></span>
          </div>
          <div class="detail">
            <span class="label">Pressure</span>
            <span class="value" id="pressure"></span>
          </div>
          <div class="detail">
            <span class="label">Visibility</span>
            <span class="value" id="visibility"></span>
          </div>
        </div>
      </div>
    </section>

    <footer>Built with WeatherAPI</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
